name: Update Company Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 1. KB스타플랫폼 제휴 후보 기업 발굴
      - name: Discover partnership candidates
        run: npm run discover

      # 2. 발굴된 기업에 대한 AI 사업/제휴 분석
      - name: Generate AI analysis
        run: npm run ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # 3. 변경된 JSON 저장
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/companies.json data/analyses.json

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore: discover partnership candidates and update AI analysis"
            git push
          fi