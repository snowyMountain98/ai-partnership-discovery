name: Update Company Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 1. KB스타플랫폼 제휴 후보 기업 발굴
      - name: Discover partnership candidates
        run: npm run discover
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 2. 발굴된 기업에 대한 AI 사업/제휴 분석
      # 상위 30개만 AI 검증하고, 나머지는 1차 발굴 후보로 화면에 유지합니다.
      - name: Generate AI analysis
        run: npm run ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # NAVER API HUB를 연결하면 News / Web / Blog / Cafe / Local 데이터를 추가 수집합니다.
      # NAVER_CLIENT_ID / NAVER_CLIENT_SECRET은 NAVER Cloud Platform > NAVER API HUB에서 발급한 값을 사용합니다.
      # YOUTUBE_API_KEY를 넣으면 YouTube 검색도 활성화됩니다.


      # 3. 변경된 JSON 저장
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/companies.json data/analyses.json

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore: discover partnership candidates and update AI analysis"
            git push
          fi